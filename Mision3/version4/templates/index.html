<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Usuario</title>
<!--  <link rel="stylesheet" href="styles.css"> -->
   <link rel="stylesheet" href="{{ url_for('static', filename='css/stylesindex.css') }}">
</head>
<body>
<header>
    <h2 style="color: white; margin-left: 2%;">Sistema Contable IA</h2> 
    <br>

</header>

<!-- Botón flotante -->
<div id="chat-button"> <img src="{{ url_for('static', filename='img/asistente.png') }}" alt="asistente" width="80%" height="80%"></div>

<!-- Ventana de chat -->
<div id="chat-box">
  <div id="chat-header" >
    <span><strong>Chat</strong></span>
    <button id="close-chat">✖️</button>
  </div>

  <div id="chat-messages">
    <p><strong>Bot:</strong> Hola 💕 ¿En qué puedo ayudarte?</p>
  </div>

  <div id="chat-input">
    <input type="text" id="message" placeholder="Escribe tu mensaje..." />
    <button id="send"><strong>Enviar</strong></button>
  </div>
</div>
 <!-- prueba icono -->

<div class="body1">
<div class="container">
    <!-- LOGIN -->
    <div class="form-box">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="text" id="login-usuario" placeholder="Usuario" required>
            <input type="password" id="login-password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <!-- REGISTRO -->
    <div class="form-box">
        <h2>Registro</h2>
        <form id="register-form">
            <input type="text" id="reg-usuario" placeholder="Usuario" required>
            <input type="email" id="reg-correo" placeholder="Correo" required>
            <input type="password" id="reg-password" placeholder="Contraseña" required>
            <input type="password" id="reg-password2" placeholder="Repetir contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
    </div>
</div>
</div>
<footer>
    <h2 style="color: white; margin-left: 2%; font-size: 12px;">COPYRIGHT © 2026 - Presentado para el BOOTCAMP DE IA - Ana Rodriguez / Isabel Alzate / Jaime Alzate / Juan Fernando Díaz / Juan David</h2> 
    <br>

</footer>

</body>
</html>
