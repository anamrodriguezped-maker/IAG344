<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <style>
        * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #fffbf3;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    display: flex;
    gap: 180px;
}

.form-box {
    background: #6fbf4a;
    width: 320px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    color: white;
}

.form-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
}

input {
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 6px;
    border: none;
}

button {
    padding: 10px;
    background: #ffffff;
    color: #6fbf4a;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #e6e6e6;
}
    </style>

<div class="container">
    <!-- LOGIN -->
    <div class="form-box">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="text" id="login-usuario" placeholder="Usuario" required>
            <input type="password" id="login-password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <!-- REGISTRO -->
    <div class="form-box">
        <h2>Registro</h2>
        <form id="register-form">
            <input type="text" id="reg-usuario" placeholder="Usuario" required>
            <input type="email" id="reg-correo" placeholder="Correo" required>
            <input type="password" id="reg-password" placeholder="Contraseña" required>
            <input type="password" id="reg-password2" placeholder="Repetir contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
    </div>
</div>

<script>
    

</script>
</body>
</html>
